name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests + debug and release APKs
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/iOSExperience-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/iOSExperience-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iOSExperience-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
